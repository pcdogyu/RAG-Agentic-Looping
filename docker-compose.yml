name: market-loop-agent

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    OLLAMA_EXTRACT_NUM_THREADS: ${OLLAMA_EXTRACT_NUM_THREADS:-8}
    OLLAMA_RESEARCH_NUM_THREADS: ${OLLAMA_RESEARCH_NUM_THREADS:-16}
    OLLAMA_CODE_NUM_THREADS: ${OLLAMA_CODE_NUM_THREADS:-8}
    OLLAMA_EXTRACT_MAX_CONCURRENCY: ${OLLAMA_EXTRACT_MAX_CONCURRENCY:-1}
    OLLAMA_RESEARCH_MAX_CONCURRENCY: ${OLLAMA_RESEARCH_MAX_CONCURRENCY:-2}
    OLLAMA_CODE_MAX_CONCURRENCY: ${OLLAMA_CODE_MAX_CONCURRENCY:-1}
  volumes:
    - ./reports:/app/reports
    - ./.git:/app/.git
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    reports-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  reports-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/reports"]
    volumes:
      - ./reports:/app/reports
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  searxng:
    image: ghcr.io/searxng/searxng:2026.8.21-bbb3c7d82@sha256:4e211fc2669b3e2ddfe571ec23fae6648e748353b31137eb8ef4972744969cda
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      GRANIAN_WORKERS: 1
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  search-mcp:
    build:
      context: ./infra/search-mcp
    environment:
      SEARXNG_URL: http://searxng:8080
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped

  duckduckgo-mcp:
    build:
      context: ./infra/duckduckgo-mcp
    environment:
      DUCKDUCKGO_TIMEOUT_SECONDS: 15
      DUCKDUCKGO_MIN_INTERVAL_SECONDS: 2
    restart: unless-stopped

  fmp-mcp:
    profiles: ["mcp"]
    build:
      context: ./infra/fmp-mcp
      args:
        FMP_MCP_COMMIT: 17fbe04cfd0322c6e8a0794e99ae95d7b4908e25
    environment:
      FMP_ACCESS_TOKEN: ${FMP_ACCESS_TOKEN:-}
      FMP_TOOL_SETS: search,company,quotes,statements,calendar,charts,news,crypto,sec-filings,earnings,dcf
      PORT: 8080
    restart: unless-stopped

  api:
    <<: *backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      reports-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      search-mcp:
        condition: service_started
      duckduckgo-mcp:
        condition: service_started

  io-worker:
    <<: *backend
    command: celery -A backend.app.worker:celery_app worker -Q io,default --concurrency=4 --loglevel=INFO

  extract-worker:
    <<: *backend
    command: celery -A backend.app.worker:celery_app worker -Q extract --concurrency=1 --prefetch-multiplier=1 --loglevel=INFO

  research-worker:
    <<: *backend
    command: celery -A backend.app.worker:celery_app worker -Q research,llm --concurrency=2 --prefetch-multiplier=1 --loglevel=INFO

  evolution-worker:
    <<: *backend
    profiles: ["evolution"]
    build:
      context: .
      dockerfile: backend/Dockerfile.evolution
    command: sh -c "git config --global --add safe.directory /app && celery -A backend.app.worker:celery_app worker -Q evolution --concurrency=1 --loglevel=INFO"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock

  scheduler:
    <<: *backend
    command: celery -A backend.app.worker:celery_app beat --loglevel=INFO

  web:
    build:
      context: frontend
      args:
        VITE_BUILD_COMMIT_ID: ${VITE_BUILD_COMMIT_ID:-unknown}
        VITE_BUILD_COMMIT_TIME: ${VITE_BUILD_COMMIT_TIME:-unknown}
        VITE_BUILD_BRANCH: ${VITE_BUILD_BRANCH:-unknown}
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres-data:
