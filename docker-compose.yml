name: market-loop-agent

services:
  reports-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/reports"]
    volumes:
      - ./reports:/app/reports
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  searxng:
    image: ghcr.io/searxng/searxng:2026.8.21-bbb3c7d82@sha256:4e211fc2669b3e2ddfe571ec23fae6648e748353b31137eb8ef4972744969cda
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      GRANIAN_WORKERS: 1
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  search-mcp:
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/search-mcp"]
    environment:
      SEARXNG_URL: http://searxng:8080
      SEARCH_MCP_ADDRESS: 0.0.0.0:8080
    healthcheck:
      test: ["CMD", "/usr/local/bin/search-mcp", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped

  fmp-mcp:
    profiles: ["mcp"]
    build:
      context: ./infra/fmp-mcp
      args:
        FMP_MCP_COMMIT: 17fbe04cfd0322c6e8a0794e99ae95d7b4908e25
    environment:
      FMP_ACCESS_TOKEN: ${FMP_ACCESS_TOKEN:-}
      FMP_TOOL_SETS: search,company,quotes,statements,calendar,charts,news,crypto,sec-filings,earnings,dcf
      PORT: 8080
    restart: unless-stopped

  go-api:
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/api"]
    env_file: .env
    environment:
      APP_ENV: production
      GO_API_ADDRESS: ":8081"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OLLAMA_ASSIST_NUM_THREADS: ${OLLAMA_ASSIST_NUM_THREADS:-8}
      OLLAMA_CODE_NUM_THREADS: ${OLLAMA_CODE_NUM_THREADS:-4}
      MARKET_ADAPTER_URL: http://market-adapter:8091
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: extract
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_ADAPTER_URL: http://market-adapter:8091
      OLLAMA_EXTRACT_BASE_URLS: ${OLLAMA_EXTRACT_BASE_URLS:-}
      OLLAMA_EXTRACT_BASE_URL: ${OLLAMA_EXTRACT_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EXTRACT_MODEL: ${OLLAMA_EXTRACT_MODEL:-qwen2.5:3b}
      OLLAMA_EXTRACT_NUM_THREADS: ${OLLAMA_EXTRACT_NUM_THREADS:-4}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-4096}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      AUTO_RESEARCH: ${AUTO_RESEARCH:-true}
      EVENT_CLUSTER_WINDOW_HOURS: ${EVENT_CLUSTER_WINDOW_HOURS:-72}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-mapping-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: mapping
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OLLAMA_ASSIST_BASE_URLS: ${OLLAMA_ASSIST_BASE_URLS:-}
      OLLAMA_ASSIST_BASE_URL: ${OLLAMA_ASSIST_BASE_URL:-http://host.docker.internal:11437}
      OLLAMA_ASSIST_MODEL: ${OLLAMA_ASSIST_MODEL:-qwen2.5:7b}
      OLLAMA_ASSIST_NUM_THREADS: ${OLLAMA_ASSIST_NUM_THREADS:-8}
      OLLAMA_ASSET_MAPPING_CONTEXT_LENGTH: ${OLLAMA_ASSET_MAPPING_CONTEXT_LENGTH:-8192}
      OLLAMA_ASSET_MAPPING_MAX_OUTPUT_TOKENS: ${OLLAMA_ASSET_MAPPING_MAX_OUTPUT_TOKENS:-1024}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-research-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: research
      GO_WORKER_CONCURRENCY: ${RESEARCH_PIPELINE_CONCURRENCY:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OLLAMA_RESEARCH_BASE_URLS: ${OLLAMA_RESEARCH_BASE_URLS:-http://host.docker.internal:11435}
      OLLAMA_RESEARCH_MODEL: ${OLLAMA_RESEARCH_MODEL:-qwen3:4b-thinking}
      OLLAMA_RESEARCH_NUM_THREADS: ${OLLAMA_RESEARCH_NUM_THREADS:-10}
      OLLAMA_RESEARCH_CONTEXT_LENGTH: ${OLLAMA_RESEARCH_CONTEXT_LENGTH:-16384}
      OLLAMA_RESEARCH_MAX_OUTPUT_TOKENS: ${OLLAMA_RESEARCH_MAX_OUTPUT_TOKENS:-8192}
      OLLAMA_RESEARCH_TIMEOUT_SECONDS: ${OLLAMA_RESEARCH_TIMEOUT_SECONDS:-900}
      RESEARCH_ASSET_SOFT_TIME_LIMIT_SECONDS: ${RESEARCH_ASSET_SOFT_TIME_LIMIT_SECONDS:-2040}
      RESEARCH_ASSET_HARD_TIME_LIMIT_SECONDS: ${RESEARCH_ASSET_HARD_TIME_LIMIT_SECONDS:-2100}
      RESEARCH_ASSET_COOLDOWN_HOURS: ${RESEARCH_ASSET_COOLDOWN_HOURS:-24}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-evolution-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile.evolution
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: evolution
      GO_WORKER_CONCURRENCY: ${OLLAMA_CODE_MAX_CONCURRENCY:-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OLLAMA_CODE_BASE_URLS: ${OLLAMA_CODE_BASE_URLS:-}
      OLLAMA_CODE_BASE_URL: ${OLLAMA_CODE_BASE_URL:-http://host.docker.internal:11438}
      OLLAMA_CODE_MODEL: ${OLLAMA_CODE_MODEL:-qwen2.5-coder:7b}
      OLLAMA_CODE_NUM_THREADS: ${OLLAMA_CODE_NUM_THREADS:-4}
      OLLAMA_CODE_CONTEXT_LENGTH: ${OLLAMA_CODE_CONTEXT_LENGTH:-16384}
      OLLAMA_CODE_MAX_OUTPUT_TOKENS: ${OLLAMA_CODE_MAX_OUTPUT_TOKENS:-8192}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      EVOLUTION_ENABLED: ${EVOLUTION_ENABLED:-false}
      EVOLUTION_AUTO_MERGE: ${EVOLUTION_AUTO_MERGE:-false}
      EVOLUTION_ROOT: /app
      EVOLUTION_BASE_BRANCH: ${EVOLUTION_BASE_BRANCH:-golang}
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-discovery-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: discovery
      GO_WORKER_CONCURRENCY: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_ADAPTER_URL: http://market-adapter:8091
      FMP_BASE_URL: ${FMP_BASE_URL:-https://financialmodelingprep.com/stable}
      FMP_ACCESS_TOKEN: ${FMP_ACCESS_TOKEN:-}
      FMP_NEWS_LOOKBACK_HOURS: ${FMP_NEWS_LOOKBACK_HOURS:-12}
      RSS_FEED_URLS: ${RSS_FEED_URLS:-}
      OFFICIAL_RSS_FEED_URLS: ${OFFICIAL_RSS_FEED_URLS:-}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-10}
      SCAN_BATCH_SIZE: ${SCAN_BATCH_SIZE:-40}
      NEWS_DISCOVERY_LOOKBACK_HOURS: ${NEWS_DISCOVERY_LOOKBACK_HOURS:-24}
      NEWS_WATERMARK_OVERLAP_MINUTES: ${NEWS_WATERMARK_OVERLAP_MINUTES:-10}
      MCP_SECRET_KEY: ${MCP_SECRET_KEY:-}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-adapter:
        condition: service_healthy
    restart: unless-stopped

  go-recovery-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: recovery
      GO_WORKER_CONCURRENCY: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RESEARCH_LEASE_SECONDS: ${RESEARCH_LEASE_SECONDS:-120}
      RESEARCH_ASSET_HARD_TIME_LIMIT_SECONDS: ${RESEARCH_ASSET_HARD_TIME_LIMIT_SECONDS:-2100}
      MODEL_AUDIT_RETENTION_DAYS: ${MODEL_AUDIT_RETENTION_DAYS:-90}
      AUTO_RESEARCH: ${AUTO_RESEARCH:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-outcomes-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: outcomes
      GO_WORKER_CONCURRENCY: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_ADAPTER_URL: http://market-adapter:8091
      FMP_BASE_URL: ${FMP_BASE_URL:-https://financialmodelingprep.com/stable}
      FMP_ACCESS_TOKEN: ${FMP_ACCESS_TOKEN:-}
      FMP_RATE_LIMIT_PER_MINUTE: ${FMP_RATE_LIMIT_PER_MINUTE:-55}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      RESEARCH_ASSET_COOLDOWN_HOURS: ${RESEARCH_ASSET_COOLDOWN_HOURS:-24}
      OLLAMA_RESEARCH_BASE_URLS: ${OLLAMA_RESEARCH_BASE_URLS:-http://host.docker.internal:11435}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-adapter:
        condition: service_healthy
    restart: unless-stopped

  go-masterdata-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: masterdata
      GO_WORKER_CONCURRENCY: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_ADAPTER_URL: http://market-adapter:8091
      FMP_BASE_URL: ${FMP_BASE_URL:-https://financialmodelingprep.com/stable}
      FMP_ACCESS_TOKEN: ${FMP_ACCESS_TOKEN:-}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      MCP_SECRET_KEY: ${MCP_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-adapter:
        condition: service_healthy
    restart: unless-stopped

  go-operations-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile.evolution
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: operations
      GO_WORKER_CONCURRENCY: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-10}
      OLLAMA_CODE_BASE_URLS: ${OLLAMA_CODE_BASE_URLS:-}
      OLLAMA_CODE_BASE_URL: ${OLLAMA_CODE_BASE_URL:-http://host.docker.internal:11438}
      EVOLUTION_ENABLED: ${EVOLUTION_ENABLED:-false}
      EVOLUTION_AUTO_MERGE: ${EVOLUTION_AUTO_MERGE:-false}
      EVOLUTION_ROOT: /app
      EVOLUTION_BASE_BRANCH: ${EVOLUTION_BASE_BRANCH:-golang}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-backfill-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: backfill
      GO_WORKER_CONCURRENCY: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OLLAMA_ASSIST_BASE_URLS: ${OLLAMA_ASSIST_BASE_URLS:-}
      OLLAMA_ASSIST_BASE_URL: ${OLLAMA_ASSIST_BASE_URL:-http://host.docker.internal:11437}
      OLLAMA_ASSIST_MODEL: ${OLLAMA_ASSIST_MODEL:-qwen2.5:7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-maintenance-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: maintenance
      GO_WORKER_CONCURRENCY: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RESEARCH_COALESCE_WINDOW_HOURS: ${RESEARCH_COALESCE_WINDOW_HOURS:-24}
      OLLAMA_RESEARCH_BASE_URLS: ${OLLAMA_RESEARCH_BASE_URLS:-http://host.docker.internal:11435}
      OLLAMA_RESEARCH_MODEL: ${OLLAMA_RESEARCH_MODEL:-qwen3:4b-thinking}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-scheduler:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/scheduler"]
    env_file: .env
    environment:
      APP_ENV: development
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-10}
      RESEARCH_LEASE_SECONDS: ${RESEARCH_LEASE_SECONDS:-120}
      RESEARCH_ASSET_HARD_TIME_LIMIT_SECONDS: ${RESEARCH_ASSET_HARD_TIME_LIMIT_SECONDS:-2100}
      MODEL_AUDIT_RETENTION_DAYS: ${MODEL_AUDIT_RETENTION_DAYS:-90}
      EVOLUTION_ENABLED: ${EVOLUTION_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  market-adapter:
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/market-adapter"]
    expose:
      - "8091"
    environment:
      ADAPTER_PORT: "8091"
      MARKET_PROVIDER_TIMEOUT_SECONDS: ${MARKET_PROVIDER_TIMEOUT_SECONDS:-90}
    healthcheck:
      test: ["CMD", "/usr/local/bin/market-adapter", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: frontend
      args:
        VITE_BUILD_COMMIT_ID: ${VITE_BUILD_COMMIT_ID:-unknown}
        VITE_BUILD_COMMIT_TIME: ${VITE_BUILD_COMMIT_TIME:-unknown}
        VITE_BUILD_BRANCH: ${VITE_BUILD_BRANCH:-unknown}
    ports:
      - "80:80"
    environment:
      API_UPSTREAM: ${WEB_API_UPSTREAM:-http://go-api:8081}
      API_BACKEND_NAME: ${WEB_API_BACKEND_NAME:-go}
    depends_on:
      - go-api

volumes:
  postgres-data:
  redis-data:
