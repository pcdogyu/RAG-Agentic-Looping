name: market-loop-agent

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    OLLAMA_EXTRACT_BASE_URLS: ${OLLAMA_EXTRACT_BASE_URLS:-}
    OLLAMA_ASSIST_MODEL: ${OLLAMA_ASSIST_MODEL:-qwen2.5:7b}
    OLLAMA_ASSIST_BASE_URL: ${OLLAMA_ASSIST_BASE_URL:-http://host.docker.internal:11437}
    OLLAMA_ASSIST_BASE_URLS: ${OLLAMA_ASSIST_BASE_URLS:-}
    OLLAMA_RESEARCH_BASE_URLS: ${OLLAMA_RESEARCH_BASE_URLS:-http://host.docker.internal:11435,http://host.docker.internal:11436,http://host.docker.internal:11439}
    OLLAMA_CODE_BASE_URLS: ${OLLAMA_CODE_BASE_URLS:-}
    OLLAMA_RESEARCH_MODEL: ${OLLAMA_RESEARCH_MODEL:-qwen2.5:7b}
    OLLAMA_EXTRACT_NUM_THREADS: ${OLLAMA_EXTRACT_NUM_THREADS:-4}
    OLLAMA_ASSIST_NUM_THREADS: ${OLLAMA_ASSIST_NUM_THREADS:-8}
    OLLAMA_RESEARCH_NUM_THREADS: ${OLLAMA_RESEARCH_NUM_THREADS:-10}
    OLLAMA_CODE_NUM_THREADS: ${OLLAMA_CODE_NUM_THREADS:-4}
    OLLAMA_EXTRACT_MAX_CONCURRENCY: ${OLLAMA_EXTRACT_MAX_CONCURRENCY:-1}
    OLLAMA_ASSIST_MAX_CONCURRENCY: ${OLLAMA_ASSIST_MAX_CONCURRENCY:-1}
    OLLAMA_RESEARCH_MAX_CONCURRENCY: ${OLLAMA_RESEARCH_MAX_CONCURRENCY:-3}
    RESEARCH_PIPELINE_CONCURRENCY: ${RESEARCH_PIPELINE_CONCURRENCY:-3}
    RESEARCH_ASSET_SOFT_TIME_LIMIT_SECONDS: ${RESEARCH_ASSET_SOFT_TIME_LIMIT_SECONDS:-2040}
    RESEARCH_ASSET_HARD_TIME_LIMIT_SECONDS: ${RESEARCH_ASSET_HARD_TIME_LIMIT_SECONDS:-2100}
    OLLAMA_7B_MAX_INPUT_TOKENS: ${OLLAMA_7B_MAX_INPUT_TOKENS:-5000}
    OLLAMA_RESEARCH_MAX_INPUT_TOKENS: ${OLLAMA_RESEARCH_MAX_INPUT_TOKENS:-3500}
    OLLAMA_RESEARCH_REVISION_MAX_INPUT_TOKENS: ${OLLAMA_RESEARCH_REVISION_MAX_INPUT_TOKENS:-2500}
    OLLAMA_ASSIST_CONTEXT_LENGTH: ${OLLAMA_ASSIST_CONTEXT_LENGTH:-16384}
    OLLAMA_RESEARCH_CONTEXT_LENGTH: ${OLLAMA_RESEARCH_CONTEXT_LENGTH:-16384}
    OLLAMA_ASSET_MAPPING_CONTEXT_LENGTH: ${OLLAMA_ASSET_MAPPING_CONTEXT_LENGTH:-8192}
    OLLAMA_ASSIST_MAX_OUTPUT_TOKENS: ${OLLAMA_ASSIST_MAX_OUTPUT_TOKENS:-8192}
    OLLAMA_RESEARCH_MAX_OUTPUT_TOKENS: ${OLLAMA_RESEARCH_MAX_OUTPUT_TOKENS:-8192}
    OLLAMA_ASSET_MAPPING_MAX_OUTPUT_TOKENS: ${OLLAMA_ASSET_MAPPING_MAX_OUTPUT_TOKENS:-1024}
    OLLAMA_RESEARCH_TIMEOUT_SECONDS: ${OLLAMA_RESEARCH_TIMEOUT_SECONDS:-900}
    OLLAMA_RESEARCH_VALIDATION_RETRY_TIMEOUT_SECONDS: ${OLLAMA_RESEARCH_VALIDATION_RETRY_TIMEOUT_SECONDS:-300}
    OLLAMA_CODE_MAX_CONCURRENCY: ${OLLAMA_CODE_MAX_CONCURRENCY:-1}
    MODEL_TASK_HEARTBEAT_SECONDS: ${MODEL_TASK_HEARTBEAT_SECONDS:-30}
    MODEL_TASK_LEASE_SECONDS: ${MODEL_TASK_LEASE_SECONDS:-180}
  volumes:
    - ./reports:/app/reports
    - ./.git:/app/.git
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    reports-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  reports-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/reports"]
    volumes:
      - ./reports:/app/reports
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  searxng:
    image: ghcr.io/searxng/searxng:2026.8.21-bbb3c7d82@sha256:4e211fc2669b3e2ddfe571ec23fae6648e748353b31137eb8ef4972744969cda
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      GRANIAN_WORKERS: 1
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  search-mcp:
    build:
      context: ./infra/search-mcp
    environment:
      SEARXNG_URL: http://searxng:8080
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped

  duckduckgo-mcp:
    build:
      context: ./infra/duckduckgo-mcp
    environment:
      DUCKDUCKGO_TIMEOUT_SECONDS: 15
      DUCKDUCKGO_MIN_INTERVAL_SECONDS: 2
    restart: unless-stopped

  fmp-mcp:
    profiles: ["mcp"]
    build:
      context: ./infra/fmp-mcp
      args:
        FMP_MCP_COMMIT: 17fbe04cfd0322c6e8a0794e99ae95d7b4908e25
    environment:
      FMP_ACCESS_TOKEN: ${FMP_ACCESS_TOKEN:-}
      FMP_TOOL_SETS: search,company,quotes,statements,calendar,charts,news,crypto,sec-filings,earnings,dcf
      PORT: 8080
    restart: unless-stopped

  api:
    <<: *backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      reports-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      search-mcp:
        condition: service_started
      duckduckgo-mcp:
        condition: service_started

  go-api:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/api"]
    env_file: .env
    environment:
      APP_ENV: production
      GO_API_ADDRESS: ":8081"
      GO_ALLOW_LEGACY_PROXY: "false"
      GO_WORKER_COMPLETED_LANES: ${GO_WORKER_COMPLETED_LANES:-}
      LEGACY_API_URL: http://api:8000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OLLAMA_ASSIST_NUM_THREADS: ${OLLAMA_ASSIST_NUM_THREADS:-8}
      OLLAMA_CODE_NUM_THREADS: ${OLLAMA_CODE_NUM_THREADS:-4}
      MARKET_ADAPTER_URL: http://market-adapter:8091
      ML_ADAPTER_URL: http://ml-adapter:8092
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-worker:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      APP_ENV: development
      GO_WORKER_LANE: ${GO_WORKER_LANE:-}
      GO_WORKER_COMPLETED_LANES: ${GO_WORKER_COMPLETED_LANES:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_ADAPTER_URL: http://market-adapter:8091
      ML_ADAPTER_URL: http://ml-adapter:8092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  go-scheduler:
    profiles: ["go-shadow"]
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    entrypoint: ["/usr/local/bin/scheduler"]
    env_file: .env
    environment:
      APP_ENV: development
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  market-adapter:
    profiles: ["go-shadow"]
    build: ./infra/market-adapter
    expose:
      - "8091"
    environment:
      ADAPTER_PORT: "8091"
    restart: unless-stopped

  ml-adapter:
    profiles: ["go-shadow"]
    build: ./infra/ml-adapter
    expose:
      - "8092"
    environment:
      ADAPTER_PORT: "8092"
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
    restart: unless-stopped

  io-worker:
    <<: *backend
    command: celery -A backend.app.worker:celery_app worker -Q io,default --concurrency=4 --loglevel=INFO

  extract-worker:
    <<: *backend
    command: sh -c 'celery -A backend.app.worker:celery_app worker -Q "$$(python -m backend.app.services.model_instances extract)" --concurrency=${OLLAMA_EXTRACT_MAX_CONCURRENCY:-1} --prefetch-multiplier=1 --loglevel=INFO'

  mapping-worker:
    <<: *backend
    command: sh -c 'celery -A backend.app.worker:celery_app worker -Q "$$(python -m backend.app.services.model_instances assist)" --concurrency=${OLLAMA_ASSIST_MAX_CONCURRENCY:-1} --prefetch-multiplier=1 --loglevel=INFO'

  research-worker:
    <<: *backend
    command: sh -c 'celery -A backend.app.worker:celery_app worker -Q "$$(python -m backend.app.services.model_instances research)" --concurrency=${RESEARCH_PIPELINE_CONCURRENCY:-3} --prefetch-multiplier=1 --loglevel=INFO'

  evolution-worker:
    <<: *backend
    profiles: ["evolution"]
    build:
      context: .
      dockerfile: backend/Dockerfile.evolution
    command: sh -c 'git config --global --add safe.directory /app && celery -A backend.app.worker:celery_app worker -Q "$$(python -m backend.app.services.model_instances code)" --concurrency=${OLLAMA_CODE_MAX_CONCURRENCY:-1} --loglevel=INFO'
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock

  scheduler:
    <<: *backend
    command: celery -A backend.app.worker:celery_app beat --loglevel=INFO

  web:
    build:
      context: frontend
      args:
        VITE_BUILD_COMMIT_ID: ${VITE_BUILD_COMMIT_ID:-unknown}
        VITE_BUILD_COMMIT_TIME: ${VITE_BUILD_COMMIT_TIME:-unknown}
        VITE_BUILD_BRANCH: ${VITE_BUILD_BRANCH:-unknown}
    ports:
      - "80:80"
    environment:
      API_UPSTREAM: ${WEB_API_UPSTREAM:-http://go-api:8081}
      API_BACKEND_NAME: ${WEB_API_BACKEND_NAME:-go}
      GO_API_UPSTREAM: ${GO_API_UPSTREAM:-http://go-api:8081}
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
