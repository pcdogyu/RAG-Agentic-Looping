name: market-loop-agent

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  volumes:
    - ./reports:/app/reports
    - ./.git:/app/.git
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    reports-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  reports-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/reports"]
    volumes:
      - ./reports:/app/reports
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  fmp-mcp:
    profiles: ["mcp"]
    build:
      context: ./infra/fmp-mcp
      args:
        FMP_MCP_COMMIT: 17fbe04cfd0322c6e8a0794e99ae95d7b4908e25
    environment:
      FMP_ACCESS_TOKEN: ${FMP_ACCESS_TOKEN:-}
      FMP_TOOL_SETS: search,company,quotes,statements,calendar,charts,news,crypto,sec-filings,earnings,dcf
      PORT: 8080
    ports:
      - "8081:8080"

  api:
    <<: *backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  io-worker:
    <<: *backend
    command: celery -A backend.app.worker:celery_app worker -Q io,default --concurrency=4 --loglevel=INFO

  llm-worker:
    <<: *backend
    command: celery -A backend.app.worker:celery_app worker -Q llm --concurrency=1 --loglevel=INFO

  evolution-worker:
    <<: *backend
    profiles: ["evolution"]
    build:
      context: .
      dockerfile: backend/Dockerfile.evolution
    command: sh -c "git config --global --add safe.directory /app && celery -A backend.app.worker:celery_app worker -Q evolution --concurrency=1 --loglevel=INFO"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock

  scheduler:
    <<: *backend
    command: celery -A backend.app.worker:celery_app beat --loglevel=INFO

  web:
    build:
      context: frontend
      args:
        VITE_BUILD_COMMIT_ID: ${VITE_BUILD_COMMIT_ID:-unknown}
        VITE_BUILD_COMMIT_TIME: ${VITE_BUILD_COMMIT_TIME:-unknown}
        VITE_BUILD_BRANCH: ${VITE_BUILD_BRANCH:-unknown}
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres-data:
