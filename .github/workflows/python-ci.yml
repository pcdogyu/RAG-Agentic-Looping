name: Python Tooling CI

on:
  push:
    branches: [main, golang]
    paths:
      - "backend/**"
      - "infra/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "infra/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,markets]"
      - run: ruff check .
      - run: python -m pytest --cov=backend.app --cov-report=term-missing
      - run: python -m backend.app.evaluation fixed-evidence
      - run: python -m backend.app.evaluation walk-forward
      - run: python -m backend.app.evaluation probability-calibration
      - run: python -m backend.app.evaluation compare-models
