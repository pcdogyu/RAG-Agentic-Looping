name: Go CI

on:
  push:
    branches: [main, golang]
    paths:
      - "backend-go/**"
      - "evals/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "backend-go/**"
      - "evals/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Run frozen Go evaluation gates
        run: |
          go run ./cmd/evaluation fixed-evidence --root ..
          go run ./cmd/evaluation walk-forward --root ..
          go run ./cmd/evaluation probability-calibration --root ..
          go run ./cmd/evaluation compare-models --root ..

  migration-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: migration_test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-go
    env:
      TEST_DATABASE_URL: postgresql://migration_test:migration_test@127.0.0.1:5432/migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Verify fresh and legacy migration contracts
        run: go test -race ./internal/migrate -run 'TestUp(Create|Upgrade)' -count=1 -v
      - name: Verify recent research filtering against PostgreSQL
        env:
          MAPPING_TEST_ISOLATED: "1"
        run: |
          set +e
          output="$(go test -race ./internal/jobs -run '^TestRecentResearchFilterAgainstPostgres$' -count=1 -v 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message="$(printf '%s\n' "$output" | tail -40 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=PostgreSQL recent research filter::$message"
            exit "$status"
          fi
