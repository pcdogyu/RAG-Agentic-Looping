[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-loop-agent"
version = "0.1.0"
description = "Evidence-first, cross-market investment research loop"
requires-python = ">=3.12,<3.14"
dependencies = [
  "celery[redis]>=5.4,<6",
  "cryptography>=45.0,<47",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "h11>=0.16,<0.17",
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "mcp>=2.0.0,<3",
  "pgvector>=0.4,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.7,<3",
  "python-dateutil>=2.9,<3",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=3.0,<3.0.3",
  "tenacity>=9,<10",
  "transformers==4.55.4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
markets = [
  "akshare>=1.16",
  "ccxt>=4.4",
  "edgartools>=4.0",
]
embeddings = [
  "fastembed>=0.7,<1",
]
dev = [
  "ddgs==9.15.0",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
